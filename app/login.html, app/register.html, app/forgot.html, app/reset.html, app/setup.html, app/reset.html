<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1220">
<meta name="robots" content="noindex">
<title>Choose a new password | MOVA Business Platform</title>
<meta name="description" content="Sign in to the MOVA Business Platform.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="css/app.css">
<script src="../assets/js/boot.js"></script>
<script src="../assets/js/config.js"></script>
</head>
<body class="app-body" data-page="reset">
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="auth">
<aside class="auth__brand"><a href="../index.html" aria-label="MOVA Technologies website"><img src="../assets/img/mova-primary-reversed.svg" width="211" height="64" alt="MOVA Technologies"></a><p class="auth__tag">Technology That Moves Business Forward.</p></aside>
<section class="auth__panel"><div class="auth__card">
<div><h1>Choose a new password</h1><p class="sub">Use 8 or more characters.</p></div>
<form class="form" data-auth novalidate>
<div class="field"><label for="password">New password</label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="72" aria-describedby="err-password"><button class="pw-toggle" type="button" data-toggle-password="password" aria-pressed="false" aria-label="Show password">Show</button></div><span class="field-error" id="err-password" role="alert"></span></div>
<div class="field"><label for="confirm">Confirm password</label><div class="pw-wrap"><input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="72" aria-describedby="err-confirm"><button class="pw-toggle" type="button" data-toggle-password="confirm" aria-pressed="false" aria-label="Show password">Show</button></div><span class="field-error" id="err-confirm" role="alert"></span></div>
<button class="btn btn--primary btn--block" type="submit">Update password <svg class="icon" aria-hidden="true" focusable="false"><use href="../assets/img/icons.svg#i-check"/></svg></button>
<p class="form-status" id="form-status" role="status" aria-live="polite"></p>
</form>
<div id="reset-invalid" hidden><p class="form-status form-status--error is-visible">This reset link is invalid or has expired.</p><p class="auth-foot"><a href="forgot.html">Request a new link</a></p></div>
</div></section>
</main>
<script type="module" src="js/auth-pages.js"></script>
</body>
</html>
